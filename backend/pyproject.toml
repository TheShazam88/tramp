[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "travel-watch-backend"
version = "0.1.0"
description = "Production-shaped FastAPI scaffold for Travel Watch."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "celery>=5.4,<6.0",
  "cryptography>=43.0,<46.0",
  "email-validator>=2.1,<3.0",
  "fastapi>=0.115,<1.0",
  "passlib[argon2]>=1.7,<2.0",
  "psycopg[binary]>=3.1,<4.0",
  "pydantic-settings>=2.3,<3.0",
  "pyotp>=2.9,<3.0",
  "pyjwt>=2.8,<3.0",
  "redis>=5.0,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.5,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
